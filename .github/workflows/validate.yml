name: Validate

on:
  push:
  pull_request:

jobs:
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Parse JavaScript
        run: node --check app.js
      - name: Verify application files
        run: test -f index.html && test -f style.css && test -f README.md
